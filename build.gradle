buildscript {
	repositories {
		maven { url 'https://maven.aliyun.com/repository/public' }
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:1.15.5"
	}
}

plugins {
	id 'maven-publish'
}

def minecraftVer = stonecutter.current.version
version = project.mod_version

// The server-side rendering kit has one jar per Minecraft line; 1.21.8 reuses 1.21.6,
// 26.3 reuses 26.2. The runtime jar is JiJ-included; 1.21.x compiles against the dev jar,
// 26.x against the production jar.
def kitVersions = [
		"1.21.5" : "1.21.5",
		"1.21.6" : "1.21.6",
		"1.21.8" : "1.21.6",
		"1.21.9" : "1.21.9",
		"1.21.11": "1.21.11",
		"26.1"   : "26.1",
		"26.2"   : "26.2",
		"26.3"   : "26.2",
]
def kitVersion = kitVersions[minecraftVer]
def kitRuntimeJar = kitVersion == null ? null : rootProject.file("libs/ryansserverrenderingkit-1.2.0+${kitVersion}.jar")
def kitCoordinate = kitVersion == null ? null : "local:ryansserverrenderingkit:1.2.0+${kitVersion}"

if (stonecutter.eval(minecraftVer, ">=26.1")) {
	apply plugin: 'net.fabricmc.fabric-loom'
} else {
	apply plugin: 'net.fabricmc.fabric-loom-remap'
}

base {
	archivesName = "${project.archives_base_name}-${minecraftVer}"
}

repositories {
	maven { url = 'https://maven.fabricmc.net/' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://repo1.maven.org/maven2' }
	mavenCentral()
	flatDir { dirs rootProject.file('libs') }
}

stonecutter {
	// 1.21.11 moved ThrownEnderpearl / ThrowableItemProjectile into the throwableitemprojectile
	// subpackage; every older node still uses the flat projectile package.
	replacements.string(current.parsed < "1.21.11") {
		replace(
				"net.minecraft.world.entity.projectile.throwableitemprojectile.ThrownEnderpearl",
				"net.minecraft.world.entity.projectile.ThrownEnderpearl"
		)
		replace(
				"net.minecraft.world.entity.projectile.throwableitemprojectile.ThrowableItemProjectile",
				"net.minecraft.world.entity.projectile.ThrowableItemProjectile"
		)
		replace(
				"net.minecraft.world.entity.projectile.throwableitemprojectile.Snowball",
				"net.minecraft.world.entity.projectile.Snowball"
		)
		// the same classes appear as mixin @At descriptors (slash form)
		replace(
				"Lnet/minecraft/world/entity/projectile/throwableitemprojectile/ThrownEnderpearl;",
				"Lnet/minecraft/world/entity/projectile/ThrownEnderpearl;"
		)
		replace(
				"Lnet/minecraft/world/entity/projectile/throwableitemprojectile/ThrowableItemProjectile;",
				"Lnet/minecraft/world/entity/projectile/ThrowableItemProjectile;"
		)
		replace(
				"Lnet/minecraft/world/entity/projectile/throwableitemprojectile/Snowball;",
				"Lnet/minecraft/world/entity/projectile/Snowball;"
		)
	}
}

loom {
	runConfigs.all {
		ideConfigGenerated true
		runDir "../../run"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${stonecutter.current.project}"

	if (stonecutter.eval(minecraftVer, ">=26.1")) {
		implementation "net.fabricmc:fabric-loader:${property("loader_version")}"
		implementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_api_version")}"
		if (kitVersion != null) {
			compileOnly files(kitRuntimeJar)
			include kitCoordinate
		}
	} else {
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${property("loader_version")}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${property("fabric_api_version")}"
		if (kitVersion != null) {
			compileOnly rootProject.files("libs/ryansserverrenderingkit-1.2.0+${kitVersion}-dev.jar")
			include kitCoordinate
		}
	}
}

processResources {
	inputs.property "minecraft", stonecutter.current.version

	filesMatching("fabric.mod.json") {
		expand([
				"minecraftVer": project.findProperty("minecraft_ver") ?: stonecutter.current.version,
				"modVer"      : mod_version
		])
	}
}

def javaVersion = stonecutter.eval(minecraftVer, ">=26.1") ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21

java {
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

jar {
	inputs.property "archivesName", "${project.base.archivesName}-${minecraftVer}"

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
	}
}
